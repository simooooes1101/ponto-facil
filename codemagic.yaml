workflows:
  android-release:
    name: Ponto Fácil - APK Android
    max_build_duration: 60
    environment:
      flutter: 3.19.6
      java: 17
    scripts:
      - name: Instalar dependências
        script: flutter pub get
      - name: Gerar APK release
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
